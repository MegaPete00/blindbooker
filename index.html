<style>
/* Layout: House of Hoss header bar with ring ropes, a silver nameplate showing the current draw,
   then the card itself as a stack of bouts (main event on top, biggest). Tokens match titlerun/template.html; keep in sync. */
:root{
  --canvas:#BDC1C6; --panel:#FFFFFF; --ink:#0E0F12; --muted:#40474F; --line:#A3A8AF; --well:#D0D3D7;
  --bar:#2F353C; --bar-ink:#FFFFFF; --bar-muted:#AEB4BB; --bar-line:#454C55;
  --rope-r:#5B18EA; --rope-w:#FFFFFF; --rope-b:#0E0F12;
  --plate-a:#F4F5F7; --plate-b:#C3C7CD; --plate-c:#7D848D; --plate-edge:#3D444C; --plate-ink:#0E0F12;
  --plate-shine:rgba(255,255,255,.6);
  --accent:#5B18EA; --on-accent:#FFFFFF; --accent-soft:rgba(91,24,234,.10); --bad:#B3202B; --bad-soft:rgba(200,35,47,.12);
  --focus:#5B18EA; --shadow:rgba(14,15,18,.18);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#16181B; --panel:#212429; --ink:#EEEFF1; --muted:#9BA2AA; --line:#33383F; --well:#2A2E34;
    --bar:#0B0C0E; --bar-ink:#FFFFFF; --bar-muted:#8D949C; --bar-line:#2A2F35;
    --rope-r:#8F5CFF; --rope-w:#E6E7EA; --rope-b:#5A616A;
    --plate-a:#DDE0E4; --plate-b:#A6ABB2; --plate-c:#646B74; --plate-edge:#30363D; --plate-ink:#0E0F12;
    --plate-shine:rgba(255,255,255,.45);
    --accent:#8F5CFF; --on-accent:#0E0F12; --accent-soft:rgba(143,92,255,.16); --bad:#FF7A84; --bad-soft:rgba(229,85,94,.18);
    --focus:#A57DFF; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#16181B; --panel:#212429; --ink:#EEEFF1; --muted:#9BA2AA; --line:#33383F; --well:#2A2E34;
  --bar:#0B0C0E; --bar-ink:#FFFFFF; --bar-muted:#8D949C; --bar-line:#2A2F35;
  --rope-r:#8F5CFF; --rope-w:#E6E7EA; --rope-b:#5A616A;
  --plate-a:#DDE0E4; --plate-b:#A6ABB2; --plate-c:#646B74; --plate-edge:#30363D; --plate-ink:#0E0F12;
  --plate-shine:rgba(255,255,255,.45);
  --accent:#8F5CFF; --on-accent:#0E0F12; --accent-soft:rgba(143,92,255,.16); --bad:#FF7A84; --bad-soft:rgba(229,85,94,.18);
  --focus:#A57DFF; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.wrap{max-width:34rem;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Header bar and ropes (same as Title Run) */
.bar{background:var(--bar);color:var(--bar-ink)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 14px}
.brand{display:grid;gap:8px;justify-items:start}
.home{display:inline-flex;align-items:center;gap:6px;color:var(--bar-muted);text-decoration:none;font-family:var(--f-label);font-weight:700;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
.home img{width:18px;height:18px;display:block}
.home:hover,.home:focus-visible{color:var(--bar-ink)}
.mark{font-family:var(--f-display);font-weight:900;font-size:1.75rem;line-height:.85;text-transform:uppercase;letter-spacing:.01em;margin:0}
.mark span{display:block;font-family:var(--f-label);font-weight:600;font-size:.7rem;letter-spacing:.22em;color:var(--bar-muted);margin-top:6px}
.modes{display:flex;gap:2px;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--bar-line)}
.modes button{background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer;font-family:var(--f-label);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bar-muted)}
.modes button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.ropes{display:grid;gap:4px;padding-block:0 8px;background:var(--bar)}
.ropes i{display:block;height:4px}
.ropes i:nth-child(1){background:var(--rope-r)}
.ropes i:nth-child(2){background:var(--rope-w)}
.ropes i:nth-child(3){background:var(--rope-b)}

main{display:grid;gap:16px;padding-block:18px 44px}
.meta{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-label);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* The draw: silver nameplate showing what you have to place next */
.plate{position:sticky;top:env(safe-area-inset-top, 0px);z-index:4;overflow:hidden;border-radius:14px;padding:20px 26px 18px;color:var(--plate-ink);
  background:
    radial-gradient(circle at 13px 13px, var(--plate-edge) 3px, transparent 3.6px),
    radial-gradient(circle at calc(100% - 13px) 13px, var(--plate-edge) 3px, transparent 3.6px),
    radial-gradient(circle at 13px calc(100% - 13px), var(--plate-edge) 3px, transparent 3.6px),
    radial-gradient(circle at calc(100% - 13px) calc(100% - 13px), var(--plate-edge) 3px, transparent 3.6px),
    linear-gradient(112deg, var(--plate-b) 0%, var(--plate-a) 26%, var(--plate-b) 50%, var(--plate-a) 72%, var(--plate-c) 100%);
  box-shadow:inset 0 0 0 2px var(--plate-edge), inset 0 0 0 5px var(--plate-a), inset 0 0 0 6px var(--plate-edge), 0 8px 22px var(--shadow)}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg, transparent 35%, var(--plate-shine) 50%, transparent 65%);transform:translateX(-120%)}
.plate.glint::after{animation:glint 1s ease-out 1}
@keyframes glint{to{transform:translateX(120%)}}
.eyebrow{font-family:var(--f-label);font-weight:700;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase}
.plate h1{font-family:var(--f-display);font-weight:900;font-size:clamp(2rem, 9vw, 3.1rem);line-height:.92;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere;margin:6px 0 8px;text-shadow:0 1px 0 var(--plate-shine)}
.plate-sub{font-family:var(--f-label);font-weight:700;font-size:.9rem;letter-spacing:.18em;text-transform:uppercase;min-height:1.2em}
.hint{font-size:.92rem;color:var(--muted);margin:0}
/* The plate sticks to the top while you scroll the card; this band keeps content from showing above it on notched phones */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--canvas)}
/* Reveal: the plate itself is the button, then the revealed match shows highlighted on the plate and flashes on the card */
.plate.tap{cursor:pointer}
.plate.tap:hover,.plate.tap:focus-visible{box-shadow:inset 0 0 0 2px var(--plate-edge), inset 0 0 0 5px var(--plate-a), inset 0 0 0 6px var(--plate-edge), 0 0 0 3px var(--accent), 0 8px 22px var(--shadow);outline:none}
.plate h1 mark{background:var(--accent);color:var(--on-accent);text-shadow:none;padding:0 .14em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.stip.flash{animation:hl 2.6s ease-out 1;border-radius:4px}
@keyframes hl{0%,45%{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 4px var(--accent)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}
.hidden-bout{border-style:dashed}
.stip.mystery{font-size:1.6rem;letter-spacing:.12em;color:var(--muted)}
.unrevealed{font-size:.88rem;color:var(--muted)}
/* Theme of the night: label + name, and the free play picker */
.theme-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.theme{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.theme-label{font-family:var(--f-label);font-weight:700;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.theme-name{font-family:var(--f-display);font-weight:900;font-size:1.45rem;line-height:1;text-transform:uppercase;color:var(--accent)}
.theme-name.hidden-theme{color:var(--muted);letter-spacing:.12em}
.theme-name.flash{animation:hl 2.6s ease-out 1;border-radius:4px}
.theme-pick{font:600 .95rem var(--f-body);padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
/* Grading: star rating per match, bonus tags under it, the card's star rating on the plate */
.stip-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rating{font-family:var(--f-display);font-weight:800;font-size:1.3rem;line-height:1;letter-spacing:.04em;color:var(--accent);white-space:nowrap}
.rating.low{color:var(--muted)}
.tags{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-family:var(--f-label);font-weight:600;font-size:.82rem;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.tags li.bad{background:var(--bad-soft);color:var(--bad)}
.plate h1 .grade{letter-spacing:.02em;white-space:nowrap}
.plate h1 .score{font-family:var(--f-label);font-weight:700;font-size:.38em;letter-spacing:.14em;vertical-align:middle;opacity:.75}
/* Finished card: big centered rating, verdict under it. Not sticky, so it doesn't sit on top of the card while scrolling. */
.plate.final{position:relative;text-align:center;padding:24px 20px 22px}
.plate.final h1{margin:10px 0 12px}
.plate.final h1 .grade{display:block;font-size:clamp(3.2rem, 15vw, 5.6rem);line-height:1}
.plate.final h1 .score{display:block;font-size:.95rem;margin-top:8px}
.plate.final .plate-sub{text-transform:none;letter-spacing:0;font-family:var(--f-body);display:grid;gap:8px;max-width:34ch;margin:0 auto}
.plate.final .verdict{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1.2}
.plate.final .note{margin:0;font-weight:600;font-size:.98rem;line-height:1.35}

/* The card: one block per bout, main event first */
.board{display:grid;gap:10px}
.bout{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;display:grid;gap:10px}
.bout.main{border:2px solid var(--ink);padding:14px 16px 16px}
.bout-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pos{font-family:var(--f-label);font-weight:700;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.bout.main .pos{color:var(--accent)}
.stip{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.bout.main .stip{font-size:1.5rem}
.fmt{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lineup{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.side{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.vs,.amp{font-family:var(--f-label);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.slot{min-width:0;border-radius:8px;padding:8px 12px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.bout.main .slot{font-size:1.35rem}
.slot.filled{background:var(--well)}
.bout .slot.open{color:var(--muted);font-family:var(--f-label);font-weight:600;font-size:.86rem;letter-spacing:.12em;padding:9px 14px;border:1.5px dashed var(--line);background:transparent}
.bout button.slot.open{cursor:pointer;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.bout button.slot.open:hover{background:var(--accent);color:var(--on-accent)}
.fresh{animation:slam .45s cubic-bezier(.2,1.5,.4,1) 1}
@keyframes slam{from{transform:translateY(-8px) scale(1.15);opacity:.2}to{transform:none;opacity:1}}

/* Finished card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.card h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:1.6rem;line-height:1;text-transform:uppercase}
.share{margin:0;white-space:pre-wrap;font:500 .9rem/1.4 var(--f-body);background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-family:var(--f-label);font-weight:700;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;background:var(--accent);color:var(--on-accent)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:active{transform:translateY(1px)}
/* Perfect card (revealed on the end screen) */
.pf-top{display:grid;justify-items:center;gap:4px;text-align:center}
.pf-stars{font-family:var(--f-display);font-weight:900;font-size:clamp(2.4rem, 11vw, 3.6rem);line-height:1;color:var(--accent);white-space:nowrap}
.pf-num{font-family:var(--f-label);font-weight:700;font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pf-you{margin:0;text-align:center;font-weight:600}
.status{font-size:.88rem;color:var(--muted);min-height:1.3em;margin:0}
#copyBox{position:absolute;left:-9999px;top:0}
footer{display:grid;gap:8px;font-size:.8rem;color:var(--muted);padding-block:0 32px;line-height:1.5}
footer p{margin:0}
footer a{color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.84rem}
.links a{font-weight:600;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){ .fresh,.plate.glint::after,.stip.flash,.theme-name.flash{animation:none} }
</style>

.hs-toast{position:fixed;left:50%;bottom:max(16px, env(safe-area-inset-bottom, 0px));z-index:80;display:grid;gap:3px;justify-items:center;text-align:center;
  width:max-content;max-width:calc(100vw - 32px);min-width:min(20rem, calc(100vw - 32px));padding:12px 20px 11px;border-radius:12px;cursor:pointer;
  background:var(--ink);color:var(--canvas);box-shadow:0 12px 32px var(--shadow, rgba(0,0,0,.3));font-family:var(--f-body);
  transform:translate(-50%, 160%);opacity:0;visibility:hidden;transition:transform .4s cubic-bezier(.2,.9,.3,1.15),opacity .3s,visibility .4s}

/* The sheet: a full-screen page over the site */
html.hs-open{overflow:hidden}
.hs-sheet{position:fixed;inset:0;z-index:70;overflow-y:auto;overscroll-behavior:contain;background:var(--canvas);color:var(--ink);font-family:var(--f-body);
  -webkit-overflow-scrolling:touch;animation:hsIn .18s ease-out}

/* ---- Toasts (they queue; tapping one opens the sheet) */
let toastEl = null, toastTimer = 0, toastQ = [], toastBusy = false, toastView = "ach";
function toast(kicker, title, line, view){ toastQ.push({kicker, title, line, view}); if(!toastBusy) nextToast(); }
function nextToast(){
  if(!toastEl){
    toastEl = document.createElement("div"); toastEl.className = "hs-toast"; toastEl.setAttribute("role", "status");
    document.documentElement.appendChild(toastEl);                                       // outside <body>: page effects can't move it
    toastEl.addEventListener("click", () => { clearTimeout(toastTimer); toastQ = []; toastBusy = false; toastEl.classList.remove("show"); open(toastView); });
  }
  const t = toastQ.shift();
  if(!t){ toastBusy = false; toastEl.classList.remove("show"); return; }
  toastBusy = true; toastView = t.view || "ach";
  toastEl.innerHTML = `<span>${esc(t.kicker)}</span><b>${esc(t.title)}</b><small>${esc(t.line)}</small>`;
  toastEl.classList.remove("show"); void toastEl.offsetWidth; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(nextToast, 4500);
}

function earn(g, id){
  const game = GAME[g]; if(!game) return;
  if(id === game.ach[0].id) holiday();                    // every game calls its first achievement on every solve
  const f = achFound(g); if(f[id]) return;
  const a = game.ach.find(x => x.id === id); if(!a) return;
  const opens = id === game.ach[0].id && SKINS.some(s => s.by === "win:" + g);           // first win: that game's color scheme opens
  f[id] = Date.now(); store.set(ACH_KEY(g), f);
  const n = game.ach.filter(x => f[x.id]).length;
  toast("Achievement unlocked", a.title, opens ? `${game.name} color scheme unlocked. Tap to see it.` : `${n} of ${game.ach.length} ${game.name} achievements. Tap to see them.`, opens ? "unlocks" : "ach");
  render();
}
function holiday(){
  const h = holidayToday(); if(!h) return;
  const f = daysFound(); if(f[h.id]) return;
  f[h.id] = Date.now(); store.set(DAY_KEY, f);
  const s = SKINS.find(x => x.by === "day:" + h.id);
  toast("Holiday award", h.title, `${s ? s.name : h.day} color scheme unlocked. Tap to see it.`, "unlocks");
  render();
}
function foundEgg(id){
  const f = eggsFound(); if(!id || f[id]) return;
  const a = EGGS.find(x => x.id === id); if(!a) return;
  f[id] = Date.now(); store.set(EGG_KEY, f);
  const n = EGGS.filter(x => f[x.id]).length, opens = SKINS.some(s => s.by === id);
  toast("Easter egg found", a.title, opens ? "New color scheme unlocked. Tap to see it." : `${n} of ${EGGS.length} found. Tap to see the rest.`, opens ? "unlocks" : "eggs");
  render();
}

/* ---- Stats (read straight from each game's save) */
const dayNo = launch => { if(!launch) return 0; const d = new Date(), [y, m, dd] = launch.split("-").map(Number);
  return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(y, m - 1, dd)) / 864e5) + 1; };
const liveStreak = (st, n) => st.lastWin >= n - 1 && st.lastWin <= n + 1 ? st.streak : 0;   // a marker past tomorrow = pre-launch numbering
function modeRows(prefix, modes, launch){
  const n = dayNo(launch);
  return `<table class="hs-tbl"><thead><tr><th></th><th>Played</th><th>Win %</th><th>Streak</th><th>Best</th></tr></thead><tbody>`
    + modes.map(([k, label]) => { const st = Object.assign({played: 0, wins: 0, streak: 0, best: 0, lastWin: 0}, store.get(`${prefix}-stats-${k}`) || {});
        return `<tr><th>${esc(label)}</th><td>${st.played}</td><td>${st.played ? Math.round(st.wins / st.played * 100) : 0}</td><td>${liveStreak(st, n)}</td><td>${st.best}</td></tr>`; }).join("")
    + `</tbody></table>`;
}
const BB_STARS = [5, 4, 3, 2, 1];                          // card ratings by whole stars (3 = ★★★ to ★★★¾)
function bbStats(){
  const st = Object.assign({played: 0, cards: 0, streak: 0, best: 0, lastDone: 0, topStars: 0, stars: {}}, store.get("bb-stats") || {});
  const n = dayNo(CFG.launch.bb), streak = st.lastDone >= n - 1 && st.lastDone <= n + 1 ? st.streak : 0, max = Math.max(1, ...BB_STARS.map(k => st.stars[k] || 0));
  return `<div class="hs-nums"><div><b>${st.topStars ? st.topStars.toFixed(2) : "-"}</b><span>Best rating</span></div><div><b>${st.played}</b><span>Daily cards</span></div>`
    + `<div><b>${streak}</b><span>Streak</span></div><div><b>${st.best}</b><span>Best streak</span></div></div>`
    + `<ol class="hs-dist" aria-label="Card ratings">` + BB_STARS.map(k => { const v = st.stars[k] || 0;
        return `<li><span>${k}★</span><span class="bar" style="width:${Math.max(9, v / max * 100)}%">${v}</span></li>`; }).join("") + `</ol>`
    + `<p class="hs-fine">${st.cards} card${st.cards === 1 ? "" : "s"} booked in all, free play included. Best rating and the chart count every finished card.</p>`;
}
const CAH_BANDS = [[99, "99"], [90, "90+"], [80, "80+"], [76, "76+"], [70, "70+"], [0, "Under 70"]];
function cahStats(){
  const st = Object.assign({played: 0, hosses: 0, streak: 0, best: 0, lastDone: 0, top: 0, ovr: {}}, store.get("cah-stats") || {});
  const n = dayNo(CFG.launch.cah), streak = st.lastDone >= n - 1 && st.lastDone <= n + 1 ? st.streak : 0, bands = CAH_BANDS.map(() => 0);
  Object.entries(st.ovr).forEach(([o, c]) => { bands[CAH_BANDS.findIndex(([min]) => +o >= min)] += c; });
  const max = Math.max(1, ...bands);
  return `<div class="hs-nums"><div><b>${st.top || "-"}</b><span>Top OVR</span></div><div><b>${st.played}</b><span>Daily Hosses</span></div>`
    + `<div><b>${streak}</b><span>Streak</span></div><div><b>${st.best}</b><span>Best streak</span></div></div>`
    + `<ol class="hs-dist" aria-label="OVR">` + CAH_BANDS.map(([, label], i) =>
        `<li><span>${label}</span><span class="bar" style="width:${Math.max(9, bands[i] / max * 100)}%">${bands[i]}</span></li>`).join("") + `</ol>`
    + `<p class="hs-fine">${st.hosses} Hoss${st.hosses === 1 ? "" : "es"} built in all, free play included. Top OVR and the chart count every finished Hoss.</p>`;
}
// Section heading with the game's logo on a dark plate (logos live in the homepage repo: /logo-<game>.svg)
const logoHead = (id, right) => `<h3 class="hs-lhead"><img class="hs-logo lg-${id}" src="${GAME[id].logo}" alt="${esc(GAME[id].name)}">`
  + (right ? `<span>${right}</span>` : "") + `</h3>`;
function statsHTML(only){
  const parts = {
    tr: () => logoHead("tr") + modeRows("tr", [["base", "Base"], ["mark", "Mark"], ["smart", "Smart Mark"], ["chaos", "Chaos"]], CFG.launch.tr),
    rr: () => logoHead("rr") + modeRows("rr", [["m", "Men's"], ["w", "Women's"]], CFG.launch.rr),
    bb: () => logoHead("bb") + bbStats(),
    cah: () => logoHead("cah") + cahStats(),
  };
  const ids = only ? [only] : ["tr", "rr", "bb", "cah"];
  return ids.map(id => `<section class="hs-sec">${parts[id]()}</section>`).join("")
    + `<p class="hs-fine">Daily games only, except where noted. Everything is saved in this browser, so a new device starts fresh.</p>`;
}

/* ---- Awards */
const shortDate = ts => new Date(ts).toLocaleDateString("en-US", {month: "short", day: "numeric"});
const card = (a, i, ts, egg) => `<li class="hs-ach ${ts ? "got" : "locked"}"><span class="no">No. ${pad(i + 1)}</span><i class="emb" aria-hidden="true">${ts ? (egg ? "!" : esc(a.g)) : "?"}</i>`
  + `<b>${esc(a.title)}</b>${egg ? "" : `<span class="d">${esc(a.desc)}</span>`}<span class="st">${ts ? "Earned " + shortDate(ts) : egg ? setProgress(a) : "Locked"}</span></li>`;
const setProgress = a => { if(!a.set) return "Not found yet";
  let n = 0; try{ n = ((JSON.parse(localStorage.getItem("hoh-sets")) || {})[a.id] || []).length; }catch(e){}
  return n ? `${n} of ${a.set} found` : "Not found yet"; };
function achHTML(){
  const order = CFG.game ? [GAME[CFG.game], ...GAMES.filter(g => g.id !== CFG.game)] : GAMES;
  const f = daysFound(), n = HOLIDAYS.filter(h => f[h.id]).length;
  return order.map(g => { const f = achFound(g.id), n = g.ach.filter(a => f[a.id]).length;
    return `<section class="hs-sec">${logoHead(g.id, `${n} of ${g.ach.length}`)}<ul class="hs-roster">${g.ach.map((a, i) => card(a, i, f[a.id], false)).join("")}</ul></section>`; }).join("")
    + `<section class="hs-sec"><h3 class="hs-dh"><span>Holidays</span><span>${n} of ${HOLIDAYS.length}</span></h3><ul class="hs-roster">`
    + HOLIDAYS.map((h, i) => card({g: h.g, title: h.title, desc: `Solve any puzzle on ${h.day}.`}, i, f[h.id], false)).join("")
    + `</ul><p class="hs-fine">Win a Title Run or a Roydle Rumble, book a full card or finish a Hoss on the day, daily or free play. Each one unlocks that holiday's color scheme for good.</p></section>`;
}
function eggsHTML(){
  const f = eggsFound(), n = EGGS.filter(a => f[a.id]).length;
  return `<section class="hs-sec"><h3>${n} of ${EGGS.length} found</h3><ul class="hs-roster">${EGGS.map((a, i) => card(a, i, f[a.id], true)).join("")}</ul>`
    + `<p class="hs-fine">Hidden all over the games. Each title is your only hint.</p></section>`;
}
function unlocksHTML(){
  const egg = s => s.by && !s.by.startsWith("win:") && !holidaySkin(s), hidden = SKINS.some(s => egg(s) && !skinOpen(s));
  const tile = s => { const openNow = skinOpen(s), on = skin === s.id;
    return `<li class="hs-skin${on ? " on" : ""}${openNow || on ? "" : " locked"}"><span class="sw" aria-hidden="true">${s.sw.map(c => `<i style="background:${c}"></i>`).join("")}</span>`
      + `<b>${esc(s.name)}</b><span class="d">${openNow || on ? esc(s.note) : esc(s.lock || (holidaySkin(s) ? `Solve any puzzle on ${HOLIDAYS.find(h => "day:" + h.id === s.by).day}.` : ""))}</span>`
      + `<button type="button" class="hs-btn" data-skin="${esc(s.id)}"${openNow && !on ? "" : " disabled"}>${on ? "In use" : openNow ? "Use" : "Locked"}</button></li>`; };
  const mystery = hidden ? `<li class="hs-skin locked"><span class="sw" aria-hidden="true"><i></i><i></i><i></i></span><b>???</b><span class="d">More color schemes are out there.</span></li>` : "";
  return `<section class="hs-sec"><h3>Color schemes</h3><ul class="hs-roster">${SKINS.filter(s => !egg(s) || skinOpen(s)).map(tile).join("")}${mystery}</ul>`
    + `<p class="hs-fine">Your pick follows you to every game on the site, on this device. A first win in each game unlocks its colors. Holiday colors unlock when you solve any puzzle on the day.</p></section>`;
}

/* ---- The sheet: a full-screen page over the site. X, Esc or the back button closes it. */
const STATS_HERE = !CFG.game || CFG.game === "bb" || CFG.game === "cah";        // homepage: every game's stats. Blind Booker: its own. The others have their own Stats pages.
let sheet = null, view = "ach";
function tabs(){ return [...(STATS_HERE ? [["stats", "Stats"]] : []), ["ach", "Achievements"], ["eggs", "Easter Eggs"], ["unlocks", "Unlocks"]]; }
function render(){
  if(!sheet) return;
  if(!tabs().some(([v]) => v === view)) view = "ach";
  const title = view === "stats" ? "Stats" : "Awards";
  sheet.querySelector("h2").textContent = title;
  sheet.setAttribute("aria-label", title);
  sheet.querySelector(".hs-seg").innerHTML = tabs().map(([v, l]) => `<button type="button" data-view="${v}" aria-pressed="${view === v}">${l}</button>`).join("");
  sheet.querySelector(".hs-body").innerHTML = view === "stats" ? statsHTML(CFG.game || "") : view === "eggs" ? eggsHTML() : view === "unlocks" ? unlocksHTML() : achHTML();
}
function open(v){
  view = v || "ach";
  if(!sheet){
    sheet = document.createElement("div"); sheet.className = "hs-sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true");
    sheet.innerHTML = `<div class="hs-in"><div class="hs-h"><h2></h2><button type="button" class="hs-x" aria-label="Close">&times;</button></div>`
      + `<div class="hs-seg" role="group" aria-label="View"></div><div class="hs-body"></div></div>`;
    sheet.addEventListener("click", e => {
      const v2 = e.target.closest("button[data-view]"), k = e.target.closest("button[data-skin]");
      if(e.target.closest(".hs-x")) close();
      else if(v2){ view = v2.dataset.view; render(); sheet.scrollTop = 0; }
      else if(k && !k.disabled) setSkin(k.dataset.skin);
    });
    document.documentElement.appendChild(sheet);
    try{ history.pushState({hoss: 1}, ""); }catch(e){}
  }
  document.documentElement.classList.add("hs-open");
  render(); sheet.scrollTop = 0;
  const x = sheet.querySelector(".hs-x"); if(x) x.focus({preventScroll: true});
}
function close(fromHistory){
  if(!sheet) return;
  sheet.remove(); sheet = null; document.documentElement.classList.remove("hs-open");
  if(!fromHistory){ try{ if(history.state && history.state.hoss) history.back(); }catch(e){} }
}
addEventListener("popstate", () => { if(sheet) close(true); });
addEventListener("keydown", e => { if(e.key === "Escape" && sheet) close(); });
document.addEventListener("click", e => { const b = e.target.closest("[data-hoss]"); if(b){ e.preventDefault(); open(b.dataset.hoss); } });

/* ---- After a game (Nov 19, Pete): "Rate <game>" stars that post to Pete's Google Form, plus "Buy me an ice cold milk".
   Every game's result card has an empty <div data-hoss-after>; it's filled here at load and shows when the card does.
   One rating per game per day per browser (hoh-rated). The post is no-cors, so the page can't read Google's reply: a network
   error shows "try again", anything else counts as sent. Settings (form + field IDs, tip link) live in site/hoss.py. */
const RATED = "hoh-rated";
const localDay = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const starRow = n => "★".repeat(n) + "☆".repeat(5 - n);
function afterHTML(){
  const g = GAME[CFG.game]; if(!g) return "";
  const r = (store.get(RATED) || {})[CFG.game], done = r && r.day === localDay();
  const rate = !CFG.fb ? "" : done
    ? `<p class="hs-rate-done">You gave ${esc(g.name)} <span aria-label="${r.stars} out of 5 stars">${starRow(r.stars)}</span> today. Thanks!</p>`
    : `<div class="hs-rate"><p class="hs-rate-q">Rate ${esc(g.name)}</p>
      <div class="hs-stars">${[1, 2, 3, 4, 5].map(v => `<button type="button" data-star="${v}" aria-pressed="false" aria-label="${v} out of 5 stars">★</button>`).join("")}</div>
      <div class="hs-rate-more" hidden>
        <textarea class="hs-rate-c" maxlength="500" rows="2" placeholder="Anything else? (optional)" aria-label="Comment (optional)"></textarea>
        <button type="button" class="hs-rate-send">Send rating</button>
      </div>
      <p class="hs-rate-msg" aria-live="polite"></p></div>`;
  const tip = CFG.tip ? `<a class="hs-milk" href="${esc(CFG.tip)}" target="_blank" rel="noopener"><img src="/milk.png" alt="" width="116" height="108">`
    + `<span><b>Buy me an ice cold milk</b><small>House of Hoss is free. Tips go through Buy Me a Coffee.</small></span></a>` : "";
  return rate + tip;
}
function fillAfter(){ document.querySelectorAll("[data-hoss-after]").forEach(el => { el.classList.add("hs-after"); el.innerHTML = afterHTML(); }); }
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", fillAfter); else fillAfter();
document.addEventListener("click", e => {
  const s = e.target.closest(".hs-stars [data-star]");
  if(s){
    const box = s.closest(".hs-rate"), v = +s.dataset.star; box.dataset.v = v;
    box.querySelectorAll("[data-star]").forEach(b => { b.classList.toggle("on", +b.dataset.star <= v); b.setAttribute("aria-pressed", +b.dataset.star === v ? "true" : "false"); });
    box.querySelector(".hs-rate-more").hidden = false;
    return;
  }
  const send = e.target.closest(".hs-rate-send");
  if(!send) return;
  const box = send.closest(".hs-rate"), v = +box.dataset.v, g = GAME[CFG.game], msg = box.querySelector(".hs-rate-msg");
  if(!v || !g || !CFG.fb) return;
  send.disabled = true; msg.textContent = "Sending...";
  const body = new URLSearchParams({[CFG.fb.game]: g.name, [CFG.fb.stars]: String(v), [CFG.fb.comment]: box.querySelector(".hs-rate-c").value.trim()});
  fetch(CFG.fb.post, {method: "POST", mode: "no-cors", body}).then(() => {
    const all = store.get(RATED) || {}; all[CFG.game] = {day: localDay(), stars: v}; store.set(RATED, all);
    box.outerHTML = `<p class="hs-rate-done">Thanks! Your <span aria-label="${v} out of 5 stars">${starRow(v)}</span> for ${esc(g.name)} is in.</p>`;
  }).catch(() => { send.disabled = false; msg.textContent = "Couldn't send that. Check your connection and try again."; });
});

skin = savedSkin(); look();
window.HOSS = {earn, foundEgg, look, open, close, achFound, eggsFound, daysFound, setSkin, GAMES, EGGS, SKINS, HOLIDAYS, store,
  get skin(){ return skin; }};
})();
</script>

/* Seeded draws: the same seed always deals the same card and the same wrestlers, in the same order.
   Daily seed = the local date, so everyone gets the same draws that day. */
function xmur3(str){ let h = 1779033703 ^ str.length;
  for(let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const pick = (r, list) => list[Math.floor(r() * list.length)];

/* The card's structure comes from data/match_types.json "card":
   fixed   = that exact stip + format
   gimmick = any stip but Standard that allows the given format
   wild    = pick a format first, by the slot's "weights" (mostly 1v1 and 2v2), then a stip that allows it.
             Never a plain 1v1 or 2v2, never a stip already used, never a stip + format already on the card. */
function buildCard(r){
  const card = [];
  CARD.forEach(slot => { if(slot.rule === "fixed") card.push({stip: slot.stip, fmt: slot.format}); else card.push(null); });
  CARD.forEach((slot, i) => {
    const taken = new Set(card.filter(Boolean).filter(m => m.stip !== "Standard").map(m => m.stip));
    const onCard = new Set(card.filter(Boolean).map(m => m.stip + "|" + m.fmt));
    if(slot.rule === "gimmick"){
      card[i] = {stip: pick(r, STIPS.filter(s => s.name !== "Standard" && !taken.has(s.name) && s.formats.includes(slot.format))).name, fmt: slot.format};
    } else if(slot.rule === "wild"){
      const ok = (s, f) => !taken.has(s.name) && !onCard.has(s.name + "|" + f) && !(s.name === "Standard" && (f === "singles" || f === "tag"));
      const fmts = Object.keys(FORMATS).filter(f => STIPS.some(s => s.formats.includes(f) && ok(s, f)));
      const w = f => (slot.weights || {})[f] ?? 1;
      let x = r() * fmts.reduce((a, f) => a + w(f), 0), fmt = fmts[fmts.length - 1];
      for(const f of fmts){ x -= w(f); if(x < 0){ fmt = f; break; } }
      card[i] = {stip: pick(r, STIPS.filter(s => s.formats.includes(fmt) && ok(s, fmt))).name, fmt};
    }
  });
  return card;
}
/* Themes (data/themes.json): each one is a slice of the roster. Daily rotates through them; free play picks one. */
const THEMES = D.themes, THEME = Object.fromEntries(THEMES.map(t => [t.id, t]));
const themePool = id => (THEME[id] || THEME.all || THEMES[0]).pool.map(i => ROSTER[i]);
// Daily theme: every theme once per cycle, in an order shuffled per cycle, never the same theme two days running.
function cycleOrder(c){
  const ids = THEMES.map(t => t.id), r = mulberry32(xmur3("bb-theme|" + c)());
  for(let i = ids.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  return ids;
}
function themeForDay(n){
  const L = THEMES.length, k = Math.max(0, n - 1), c = Math.floor(k / L), order = cycleOrder(c);
  if(c > 0 && L > 2 && order[0] === cycleOrder(c - 1)[L - 1]) [order[0], order[1]] = [order[1], order[0]];
  return order[k % L];
}
function deal(seed, themeId){
  const r = mulberry32(xmur3("bb2|" + seed)());
  const matches = buildCard(r);
  const need = matches.reduce((n, m) => n + FORMATS[m.fmt].sides.reduce((a, b) => a + b, 0), 0);
  const pool = themePool(themeId), wrestlers = [];
  for(let i = 0; i < need; i++){ const j = i + Math.floor(r() * (pool.length - i)); [pool[i], pool[j]] = [pool[j], pool[i]]; wrestlers.push(pool[i]); }
  return {matches, wrestlers};
}

const matchName = m => m.stip === "Standard" ? STD_NAME[m.fmt] : m.stip;

/* ---- Grading. Every number here is a knob; change it and the whole game follows.
   Match rating = average star tier of everyone in it (roster.json tier: 5 GOAT ... 1 midcarder, -1 jobber), plus bonuses:
     rivals    two rivals on opposite sides (rivals.json): RIVALS, or ALLTIME if flagged all-time   best one per match
     team      a real tag team (TEAM) or stable (STABLE) on the same side (teams.json kind)          per side, best one only
     spec      a wrestler in their specialty match (roster.json spec), each                           max 1 per match
   A jobber in the main event caps it at JOBBER_CAP. Ratings run -1 to 5 stars in quarters (Meltzer has negative stars too).
   Card rating = the match ratings weighted by card position (match_types.json grade_weight), kept between CARD_MIN and
   MAX stars and shown in quarters with the exact number beside it (3.27 shows as ★★★¼). No curve: everyone on a daily
   has the same draws, so the number is the comparison. Stacked theme nights (World Champions) simply rate higher.
   Nov 10 sims, sensible booking (stars up top, jobbers down low), all themes pooled: median 2.75, top 10% 3.55, top 1%
   4.0. All Eras alone: median 1.95. World Champions: median 3.55. Run blindbooker/simulate.js to redo these. */
const GRADE = {
  RIVALS: 1, ALLTIME: 2, TEAM: 1, STABLE: 0.5, SPEC: 0.5, SPEC_MAX: 1, JOBBER_CAP: 1, MIN: -1, MAX: 5, SIX: 6.5, CARD_MIN: 1,
  // The verdict under the card rating, by its quarter-star value (first match wins). Pete's lines, Nov 10.
  HEADLINES: [[5, "Absolutely legendary. One of the greatest cards ever booked."],
              [4, "An instant classic. A favorite for Card of the Year."],
              [3, "A solid showing. You didn't light the world on fire, but the fans went home happy."],
              [2, "Forgettable at best. Marks are lighting you up on Twitter, pal."],
              [-9, "An awful showing. This one was a late-stage WCW level disaster."]],
  // Achievements (site/hoss.js), by the quarter-star value shown: about 17%, 3% and 2% of sensibly booked cards
  CLASSIC: 3.5, TAPE: 4, DISASTER: 1.25
};
const TIER = D.tiers, SPEC = D.spec;
const RIVAL = new Map(D.rivals.map(([a, b, src]) => [a + "|" + b, src]));
const rivalSrc = (a, b) => RIVAL.get(a < b ? a + "|" + b : b + "|" + a);
const TEAM_OF = {}, TEAM_KIND = {};  // name -> list of team names; team name -> "tag" | "stable"
D.teams.forEach(([tn, ms, kind]) => { TEAM_KIND[tn] = kind; ms.forEach(n => (TEAM_OF[n] = TEAM_OF[n] || []).push(tn)); });
const half = x => x === 0.5 ? "½" : x;
const quarter = x => Math.round(x * 4) / 4;
function starStr(x){
  if(x >= GRADE.SIX) return "★★★★★★";
  if(x === 0) return "DUD";
  const neg = x < 0, a = Math.abs(x), full = Math.floor(a), fr = a - full;
  const f = fr === 0.25 ? "¼" : fr === 0.5 ? "½" : fr === 0.75 ? "¾" : "";
  return (neg ? "−" : "") + (full ? "★".repeat(full) + f : f + "★");      // "★★★½", "½★", "−★"
}
// people = [[names on side 0], [side 1], ...]
function rateMatch(m, pos, people){
  const all = people.flat(), tags = [];
  let raw = all.reduce((s, n) => s + (TIER[n] ?? 1), 0) / all.length;
  // rivals across sides
  let riv = null;                    // best rivalry across sides: an all-time one (3) beats a regular one (1)
  for(let i = 0; i < people.length; i++) for(let j = i + 1; j < people.length; j++)
    for(const a of people[i]) for(const b of people[j]) { const s = rivalSrc(a, b); if(s && (!riv || s > riv[2])) riv = [a, b, s]; }
  if(riv){
    const b = riv[2] === 3 ? GRADE.ALLTIME : GRADE.RIVALS; raw += b;
    tags.push(riv[2] === 3 ? `All-time rivalry: ${riv[0]} vs ${riv[1]} +${b}★` : `Rivals: ${riv[0]} vs ${riv[1]} +${b}★`);
  }
  // real teams on the same side: each side scores its best one (a tag team beats a stable)
  let teamB = 0;
  people.forEach(side => {
    if(side.length < 2) return;
    const seen = {};
    side.forEach(n => (TEAM_OF[n] || []).forEach(tn => { seen[tn] = (seen[tn] || 0) + 1; }));
    const found = Object.keys(seen).filter(k => seen[k] >= 2);
    const tn = found.find(k => TEAM_KIND[k] === "tag") || found[0];
    if(!tn) return;
    const b = TEAM_KIND[tn] === "tag" ? GRADE.TEAM : GRADE.STABLE;
    teamB += b; tags.push(TEAM_KIND[tn] === "tag" ? `Tag team: ${tn} +${half(b)}★` : `Stable: ${tn} +${half(b)}★`);
  });
  raw += teamB;
  // specialty match
  let specB = 0;
  all.forEach(n => { if((SPEC[n] || []).includes(m.stip) && specB < GRADE.SPEC_MAX){ specB += GRADE.SPEC; tags.push(`Specialty: ${n}, ${m.stip} +${GRADE.SPEC === 0.5 ? "½" : GRADE.SPEC}★`); } });
  raw += specB;
  let stars = quarter(Math.max(GRADE.MIN, Math.min(GRADE.MAX, raw)));
  const jobbers = all.filter(n => TIER[n] === -1);
  if(pos === 0 && jobbers.length){ stars = Math.min(stars, GRADE.JOBBER_CAP); tags.push(`Jobber in the main event: ${jobbers.join(" & ")}. Capped at ${starStr(GRADE.JOBBER_CAP)}`); }
  if(raw >= GRADE.SIX) tags.push("Meltzer broke the scale");
  return {stars: raw >= GRADE.SIX ? GRADE.SIX : stars, counts: Math.min(stars, GRADE.MAX), tags, jobbers, rivalry: riv};
}
// {rated: per-match ratings, raw: weighted score, rating: card rating 1-5 (exact), stars: rating in quarters, headline}
function gradeCard(matches, peopleOf){
  const rated = matches.map((m, pos) => rateMatch(m, pos, peopleOf(pos)));
  const wsum = CARD.reduce((s, c) => s + (c.grade_weight || 0), 0);
  const raw = rated.reduce((s, r, pos) => s + r.counts * (CARD[pos].grade_weight || 0), 0) / wsum;
  const rating = Math.round(Math.max(GRADE.CARD_MIN, Math.min(GRADE.MAX, raw)) * 100) / 100, stars = quarter(rating);
  return {rated, raw, rating, stars, headline: headline(rated, stars)};
}
// The verdict line (by stars) plus a main event note: a jobber in it, or an all-time rivalry in it
function headline(rated, stars){
  const main = rated[0], line = GRADE.HEADLINES.find(([c]) => stars >= c)[1];
  const who = main.jobbers.length > 1 ? main.jobbers.slice(0, -1).join(", ") + " and " + main.jobbers.at(-1) : main.jobbers[0];
  const note = who ? `Fans want refunds. The world was baffled to see ${who} in the main event.`
    : main.rivalry && main.rivalry[2] === 3 ? `${main.rivalry[0]} vs ${main.rivalry[1]} put on another classic.` : "";
  return {line, note};
}

/* Perfect card: the best rating these exact draws could make, booked with hindsight (knowing everyone who was coming).
   Local search: from a tier-sorted start plus PERFECT_STARTS seeded random starts, swap any two wrestlers while it helps.

const PERFECT_STARTS = 120;      // Nov 10: 0 misses vs 800 starts on 350 cards; ~120 ms a card on a laptop
const slotKeys = matches => matches.flatMap((m, pos) => FORMATS[m.fmt].sides.flatMap((n, side) => Array.from({length: n}, (_, k) => `${pos}-${side}-${k}`)));
function perfectCard(dl, seed){
  const keys = slotKeys(dl.matches), W = dl.wrestlers, n = keys.length, at = Object.fromEntries(keys.map((k, i) => [k, i]));
  const people = perm => pos => FORMATS[dl.matches[pos].fmt].sides.map((c, side) => Array.from({length: c}, (_, k) => W[perm[at[`${pos}-${side}-${k}`]]]));
  const score = perm => gradeCard(dl.matches, people(perm)).raw;
  const r = mulberry32(xmur3("bb-perfect|" + seed)());
  const starts = [[...W.keys()].sort((a, b) => (TIER[W[b]] ?? 1) - (TIER[W[a]] ?? 1))];
  for(let s = 0; s < PERFECT_STARTS; s++){ const p = [...W.keys()]; for(let i = n - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } starts.push(p); }
  let best = null, bestScore = -Infinity;
  for(const p of starts){
    let cur = score(p), better = true;
    while(better){
      better = false;
      for(let i = 0; i < n; i++) for(let j = i + 1; j < n; j++){
        [p[i], p[j]] = [p[j], p[i]]; const v = score(p);
        if(v > cur + 1e-9){ cur = v; better = true; } else [p[i], p[j]] = [p[j], p[i]];
      }
    }
    if(cur > bestScore + 1e-9){ bestScore = cur; best = [...p]; }
  }
  return {peopleOf: people(best), grade: gradeCard(dl.matches, people(best))};
}

/* Dates and puzzle numbers (local midnight, like Title Run) */
const pad = n => String(n).padStart(2, "0");
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayNo = iso => { const [y,m,d] = iso.split("-").map(Number), [ly,lm,ld] = D.launch.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ly, lm - 1, ld)) / 864e5) + 1; };
/* The daily's theme, card and draw order come from the saved schedule (blindbooker/build.py, site/daily_lock.py), so adding
   wrestlers, themes or match types after launch never changes a day anyone could have played.
   D.daily.days[n - from] = [theme, [[stip index, format], ...], [roster index, ...]]. Past the schedule's end: drawn from the date. */
function dailyOf(iso){
  const n = dayNo(iso), e = D.daily && D.daily.days[n - D.daily.from];
  if(!e){ const theme = themeForDay(n); return {theme, name: (THEME[theme] || {}).name, deal: deal(iso, theme)}; }
  const [t, ms, ws] = e, [theme, name] = D.daily.themes[t];
  return {theme, name, deal: {matches: ms.map(([s, fmt]) => ({stip: STIPS[s].name, fmt})), wrestlers: ws.map(i => ROSTER[i])}};
}

/* Game state: the seed, how many hidden matches have been revealed (r), and which slot each drawn wrestler went into (w).
   Everything else is replayed from those. */
let S = null, fresh = null, showing = false, holdTimer = null;
const valid = g => g && g.v === SAVE_V && Array.isArray(g.w) && typeof g.r === "number";
// Matches hidden until the player reveals them, in card order (gimmick semi-main, then the wild card opener)
const REVEALS = CARD.map((c, i) => c.rule === "fixed" ? -1 : i).filter(i => i >= 0);
const REVEAL_LABEL = {gimmick: "gimmick match", wild: "wild card match"};
const REVEAL_TITLE = {gimmick: "Gimmick match", wild: "Wild card"};
const revealed = pos => CARD[pos].rule === "fixed" || REVEALS.indexOf(pos) < S.r;
const ready = () => S.t && S.r >= REVEALS.length && !showing;
/* Theme reveal (Nov 22, Pete: people weren't noticing the theme). The first plate click reveals the theme (S.t = 1), before the matches.
   Saves from before this have no t: anything already started counts as revealed. A free-play theme the player picked is never hidden. */
const themeDone = s => { if(s.t === undefined) s.t = s.r > 0 || s.w.length > 0 ? 1 : 0; return s; };
function load(mode){
  if(mode === "daily"){
    const today = localISO(new Date()), saved = store.get("bb-daily");
    S = themeDone(valid(saved) && saved.seed === today ? saved : {v: SAVE_V, seed: today, r: 0, w: [], t: 0});
    const day = dailyOf(today);                                // same theme and same draws for everyone today
    S.theme = day.theme; S.themeLabel = day.name; S.deal = day.deal;
  } else {
    const saved = store.get("bb-free");
    S = themeDone(valid(saved) && THEME[saved.theme] ? saved : newFree());
    S.deal = deal(S.seed, S.theme);
  }
  S.mode = mode; PERFECT = null; $("#perfect").innerHTML = ""; fresh = null; showing = false; clearTimeout(holdTimer);
  store.set("bb-mode", mode);
}
// Free play theme: the player's pick ("random" = a new random theme every card), remembered in bb-pick
const freePick = () => { const p = store.get("bb-pick"); return p && (p === "random" || THEME[p]) ? p : "random"; };
function newFree(){
  const pick = freePick(), theme = pick === "random" ? THEMES[Math.floor(Math.random() * THEMES.length)].id : pick;
  return {v: SAVE_V, seed: "free-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), theme, r: 0, w: [], t: pick === "random" ? 0 : 1};
}
function save(){ const {deal: _, mode, themeLabel: __, ...keep} = S; store.set(mode === "daily" ? "bb-daily" : "bb-free", keep); }
const themeName = () => S.themeLabel || (THEME[S.theme] || {}).name || "All Eras";   // a frozen daily keeps its theme's name even if the theme is later renamed or turned off

const done = () => S.w.length >= S.deal.wrestlers.length;
const whoIn = key => { const i = S.w.indexOf(key); return i < 0 ? null : S.deal.wrestlers[i]; };

// The plate is the reveal button. Each click shows the next hidden match on the plate, highlighted, for a beat;
// then the plate moves on (next reveal prompt, or the first wrestler after the last reveal).
function reveal(){
  if(showing) return;
  if(!S.t){                                                   // the theme comes first, and holds a little longer so it sinks in
    S.t = 1; fresh = "theme"; save(); showing = "theme";
    holdTimer = setTimeout(() => { showing = false; fresh = "prompt"; render(); }, 2000);
    render(); return;
  }
  if(S.r >= REVEALS.length) return;
  S.r++; fresh = "m" + REVEALS[S.r - 1]; save();
  const last = S.r === REVEALS.length;
  showing = true;
  holdTimer = setTimeout(() => { showing = false; fresh = last ? "draw" : "prompt"; render(); }, last ? 1800 : 1500);
  render();
}
function placeWrestler(key){
  if(!ready() || done() || S.w.includes(key)) return;
  S.w.push(key); fresh = key; save(); render();
  if(done()){ cardDone(); window.scrollTo({top: 0, behavior: "smooth"}); }
}
/* Stats + achievements (shared House of Hoss layer, site/hoss.js). Each finished card counts once, by mode + seed.
   bb-stats: topStars = best card rating (exact), stars = {1..5: cards} by whole stars (3 = ★★★ to ★★★¾). */
function cardDone(){
  const g = gradeCard(S.deal.matches, peopleOf), key = S.mode + ":" + S.seed;
  const st = Object.assign({played: 0, cards: 0, streak: 0, best: 0, lastDone: 0, topStars: 0, stars: {}, seen: []}, store.get("bb-stats") || {});
  if(st.seen.includes(key)) return;
  delete st.letters; delete st.top;                                          // letter-grade stats from before Nov 10
  st.seen = [...st.seen.slice(-60), key];
  const b = Math.floor(g.stars);
  st.cards++; st.stars[b] = (st.stars[b] || 0) + 1; st.topStars = Math.max(st.topStars, g.rating);
  if(S.mode === "daily"){ const n = dayNo(S.seed); st.played++; st.streak = st.lastDone === n - 1 ? st.streak + 1 : 1; st.best = Math.max(st.best, st.streak); st.lastDone = n; }
  store.set("bb-stats", st);
  const earn = id => window.HOSS && HOSS.earn("bb", id);          // the Claude preview has no site layer
  earn("first");
  if(g.stars >= GRADE.CLASSIC) earn("classic");
  if(g.stars >= GRADE.TAPE) earn("tape");
  if(g.stars <= GRADE.DISASTER) earn("disaster");
  if(g.rated[0].jobbers.length) earn("jobber");
  if(g.rated.some(r => r.tags.some(t => t.startsWith("All-time rivalry")))) earn("dream");
  if(g.rated.some(r => r.stars >= GRADE.SIX)) earn("six");
  if(S.mode === "daily" && st.streak >= 7) earn("week");
}

/* Rendering */
function slotHTML(key, live){
  const who = whoIn(key);
  if(who) return `<span class="slot filled${fresh === key ? " fresh" : ""}">${esc(who)}</span>`;
  return live ? `<button type="button" class="slot open" data-slot="${key}">Book here</button>`
              : `<span class="slot open">Open</span>`;
}
function boutHTML(m, pos){
  const main = pos === 0 ? " main" : "";
  if(!revealed(pos)) return `<article class="bout${main} hidden-bout">
    <div class="bout-h"><span class="pos">${esc(CARD[pos].pos)}</span></div>
    <div class="stip mystery">???</div>
    <div class="unrevealed">${CARD[pos].rule === "wild" ? "Wild card match. Could be anything." : "1v1 gimmick match."} Revealed before the draw.</div></article>`;
  const live = ready() && !done(), fl = fmtLabel(m);
  const sides = FORMATS[m.fmt].sides.map((n, side) =>
    `<div class="side">${Array.from({length: n}, (_, k) => slotHTML(`${pos}-${side}-${k}`, live)).join('<span class="amp">&amp;</span>')}</div>`);
  const now = fresh === "m" + pos, r = GRADED && GRADED.rated[pos];
  return `<article class="bout${main}${now ? " fresh" : ""}">
    <div class="bout-h"><span class="pos">${esc(CARD[pos].pos)}</span>${fl ? `<span class="fmt">${esc(fl)}</span>` : ""}</div>
    <div class="stip-row"><div class="stip${now ? " flash" : ""}">${esc(matchName(m))}</div>${r ? `<div class="rating${r.stars < 1 ? " low" : r.stars >= 4 ? " high" : ""}" aria-label="${r.stars} stars">${starStr(r.stars)}</div>` : ""}</div>
    <div class="lineup">${sides.join('<span class="vs">vs</span>')}</div>
    ${r && r.tags.length ? `<ul class="tags">${r.tags.map(x => `<li${/^Jobber/.test(x) ? ' class="bad"' : ""}>${esc(x)}</li>`).join("")}</ul>` : ""}</article>`;
}
// The perfect card, shown after "Reveal perfect card" (S.pf = revealed; saved with the card)
let PERFECT = null;
function perfectHTML(){
  const pc = PERFECT || (PERFECT = perfectCard(S.deal, S.seed)), g = pc.grade, mine = GRADED;
  const mts = S.deal.matches.map((m, pos) => {
    const r = g.rated[pos], fl = fmtLabel(m), main = pos === 0 ? " main" : "";
    const sides = pc.peopleOf(pos).map(side => `<div class="side">${side.map(n => `<span class="slot filled">${esc(n)}</span>`).join('<span class="amp">&amp;</span>')}</div>`);
    return `<article class="bout${main}">
      <div class="bout-h"><span class="pos">${esc(CARD[pos].pos)}</span>${fl ? `<span class="fmt">${esc(fl)}</span>` : ""}</div>
      <div class="stip-row"><div class="stip">${esc(matchName(m))}</div><div class="rating${r.stars < 1 ? " low" : r.stars >= 4 ? " high" : ""}" aria-label="${r.stars} stars">${starStr(r.stars)}</div></div>
      <div class="lineup">${sides.join('<span class="vs">vs</span>')}</div>
      ${r.tags.length ? `<ul class="tags">${r.tags.map(x => `<li${/^Jobber/.test(x) ? ' class="bad"' : ""}>${esc(x)}</li>`).join("")}</ul>` : ""}</article>`;
  }).join("");
  const pct = Math.round(mine.rating / g.rating * 100);
  return `<h2>The perfect card</h2>
    <div class="pf-top"><span class="pf-stars" aria-label="${g.stars} stars">${starStr(g.stars)}</span><span class="pf-num">${g.rating.toFixed(2)} out of 5</span></div>
    <p class="pf-you">${mine.rating >= g.rating - 1e-9 ? "You booked the perfect card. Nobody does that." : `Yours: ${starStr(mine.stars)} ${mine.rating.toFixed(2)}. That's ${pct}% of perfect.`}</p>
    <p class="hint">The best rating today's draws could make, booked by someone who knew who was coming through the curtain.</p>
    <div class="board">${mts}</div>`;
}
const peopleOf = pos => FORMATS[S.deal.matches[pos].fmt].sides.map((n, side) => Array.from({length: n}, (_, k) => whoIn(`${pos}-${side}-${k}`)));
/* One thing to copy: the rating and a link. Never the names (Nov 20, Pete: shared names spoil the daily). */
const shareTop = g => [`${S.mode === "daily" ? `Blind Booker #${dayNo(S.seed)}` : "Blind Booker free play"} · ${themeName()}`,
  `My card got a ${starStr(g.stars)} Star Rating (${g.rating.toFixed(2)})`];
function shareShort(){
  const g = gradeCard(S.deal.matches, peopleOf), lines = shareTop(g);
  if(D.site) lines.push(`${S.mode === "daily" ? "Book today's card" : "Book your own"}: ${D.site}`);
  return lines.join("\n");
}
let GRADED = null;
function render(){
  const plate = $("#plate"), n = S.deal.wrestlers.length, over = done();
  GRADED = over ? gradeCard(S.deal.matches, peopleOf) : null;
  $("#modeDaily").setAttribute("aria-pressed", S.mode === "daily");
  $("#modeFree").setAttribute("aria-pressed", S.mode === "free");
  $("#metaL").textContent = S.mode === "daily" ? `Daily #${dayNo(S.seed)}` : "Free play";
  $("#metaR").textContent = S.mode === "daily" ? new Date().toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric"}) : "";
  $("#themeName").textContent = S.t ? themeName() : "???";
  $("#themeName").classList.toggle("hidden-theme", !S.t);
  $("#themeName").classList.toggle("flash", fresh === "theme");
  $("#themeLabel").textContent = S.mode === "daily" ? "Tonight's theme" : "Theme";
  $("#themePick").hidden = S.mode !== "free";
  if(S.mode === "free") $("#themePick").value = freePick();
  const prompt = (!S.t || S.r < REVEALS.length) && !showing;   // the plate is a button right now
  plate.classList.toggle("tap", prompt);
  plate.classList.toggle("final", over);                     // finished card: the rating is the centerpiece
  if(prompt){ plate.setAttribute("role", "button"); plate.tabIndex = 0; } else { plate.removeAttribute("role"); plate.removeAttribute("tabindex"); }
  if(prompt && !S.t){
    $("#drawEyebrow").textContent = S.mode === "daily" ? "Tonight's theme" : "Theme";
    $("#drawName").textContent = S.mode === "daily" ? "Click to reveal tonight's theme" : "Click to reveal the theme";
    $("#drawSub").textContent = "\u00a0";
    $("#hint").textContent = "";
  } else if(showing === "theme"){
    $("#drawEyebrow").textContent = S.mode === "daily" ? "Tonight's theme" : "Theme";
    $("#drawName").innerHTML = `<mark>${esc(themeName())}</mark>`;
    $("#drawSub").textContent = `${themePool(S.theme).length} wrestlers in the pool`;
    $("#hint").textContent = "";
  } else if(prompt){
    const slot = CARD[REVEALS[S.r]];
    $("#drawEyebrow").textContent = slot.pos;
    $("#drawName").textContent = `Click to reveal ${REVEAL_LABEL[slot.rule]}`;
    $("#drawSub").textContent = "\u00a0";
    $("#hint").textContent = "";
  } else if(showing){
    const pos = REVEALS[S.r - 1], m = S.deal.matches[pos];
    $("#drawEyebrow").textContent = `${CARD[pos].pos}: ${REVEAL_TITLE[CARD[pos].rule]}`;
    $("#drawName").innerHTML = `<mark>${esc(matchName(m))}</mark>`;
    $("#drawSub").textContent = fmtLabel(m) || "\u00a0";
    $("#hint").textContent = "";
  } else if(!over){
    $("#drawEyebrow").textContent = `Wrestler ${S.w.length + 1} of ${n}`;
    $("#drawName").textContent = S.deal.wrestlers[S.w.length];
    $("#drawSub").textContent = " ";
    $("#hint").textContent = "Put them in any open spot. No take-backs.";
  } else {
    $("#drawEyebrow").textContent = S.mode === "daily" ? `Blind Booker #${dayNo(S.seed)}: card rating` : "Free play: card rating";
    $("#drawName").innerHTML = `<span class="grade" aria-label="${GRADED.stars} stars">${starStr(GRADED.stars)}</span><span class="score">${GRADED.rating.toFixed(2)} out of 5</span>`;
    $("#drawSub").innerHTML = `<p class="verdict">${esc(GRADED.headline.line)}</p>${GRADED.headline.note ? `<p class="note">${esc(GRADED.headline.note)}</p>` : ""}`;
    $("#hint").textContent = "Main event counts most (40%), then semi-main 25%, midcard 20%, opener 15%.";
  }
  if(fresh){ plate.classList.remove("glint"); void plate.offsetWidth; plate.classList.add("glint"); }
  $("#board").innerHTML = S.deal.matches.map(boutHTML).join("");
  $("#done").hidden = !over;
  $("#perfect").hidden = !(over && S.pf);
  if(over && S.pf && !$("#perfect").innerHTML) $("#perfect").innerHTML = perfectHTML();
  if(!(over && S.pf)) $("#perfect").innerHTML = "";
  if(over){
    $("#share").textContent = shareShort();
    $("#doneTitle").textContent = S.mode === "daily" ? "Tonight's card" : "Your card";
    $("#againBtn").textContent = S.mode === "daily" ? "Free play" : "Book another";
    $("#perfectBtn").hidden = !!S.pf;
  }
  $("#status").textContent = over && S.mode === "daily" ? nextLine() : "";
  $("#foot").textContent = S.t ? `${themePool(S.theme).length} wrestlers in the ${themeName()} pool, ${STIPS.length - 1} gimmick matches. A new daily card and theme at midnight your time.`
                               : `${STIPS.length - 1} gimmick matches. A new daily card and theme at midnight your time.`;
}
function nextLine(){
  const now = new Date(), t = new Date(now); t.setHours(24, 0, 0, 0);
  const mins = Math.max(1, Math.round((t - now) / 6e4));
  return `New card in ${Math.floor(mins / 60)}h ${mins % 60}m.`;
}

/* Wiring */
$("#board").addEventListener("click", e => {
  const b = e.target.closest("button[data-slot]"); if(b) placeWrestler(b.dataset.slot);
});
$("#plate").addEventListener("click", () => { if($("#plate").classList.contains("tap")) reveal(); });
$("#plate").addEventListener("keydown", e => {
  if($("#plate").classList.contains("tap") && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); reveal(); } });
$("#themePick").innerHTML = `<option value="random">Random theme</option>` + THEMES.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
$("#themePick").addEventListener("change", e => {                 // picking a theme deals a fresh free-play card with it
  store.set("bb-pick", e.target.value); store.set("bb-free", newFree()); load("free"); render();
});
$("#modeDaily").addEventListener("click", () => { load("daily"); render(); });
$("#modeFree").addEventListener("click", () => { load("free"); render(); });
$("#againBtn").addEventListener("click", () => {
  if(S.mode === "free") store.set("bb-free", newFree());
  load("free"); render(); window.scrollTo({top: 0, behavior: "smooth"});
});
function copy(text, said){
  const ok = () => { $("#status").textContent = said; };
  const fallback = () => { const box = $("#copyBox"); box.value = text; box.select();
    try{ if(!document.execCommand("copy")) throw 0; ok(); }catch(e){ $("#status").textContent = "Couldn't copy. Select the card text and copy it yourself."; } };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}
$("#perfectBtn").addEventListener("click", () => {
  const b = $("#perfectBtn"); b.disabled = true; b.textContent = "Booking it...";
  setTimeout(() => {                                     // let the button repaint before the search runs
    S.pf = true; save(); b.disabled = false; b.textContent = "Reveal perfect card"; render();
    $("#perfect").scrollIntoView({behavior: "smooth", block: "start"});
  }, 30);
});
$("#copyShort").addEventListener("click", () => copy(shareShort(), "Rating copied. Go start an argument."));
setInterval(() => { if(S && S.mode === "daily" && done()) $("#status").textContent = nextLine(); }, 60000);

load(store.get("bb-mode") === "free" ? "free" : "daily");
render();

</script>
</body>
</html>
