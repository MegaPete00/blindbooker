<style>
/* Layout: House of Hoss header bar with ring ropes, a silver nameplate showing the current draw,
   then the card itself as a stack of bouts (main event on top, biggest). Tokens match titlerun/template.html; keep in sync. */
:root{
  --canvas:#BDC1C6; --panel:#FFFFFF; --ink:#0E0F12; --muted:#40474F; --line:#A3A8AF; --well:#D0D3D7;
  --bar:#2F353C; --bar-ink:#FFFFFF; --bar-muted:#AEB4BB; --bar-line:#454C55;
  --rope-r:#5B18EA; --rope-w:#FFFFFF; --rope-b:#0E0F12;
  --plate-a:#F4F5F7; --plate-b:#C3C7CD; --plate-c:#7D848D; --plate-edge:#3D444C; --plate-ink:#0E0F12;
  --plate-shine:rgba(255,255,255,.6);
  --accent:#5B18EA; --on-accent:#FFFFFF; --accent-soft:rgba(91,24,234,.10); --bad:#B3202B; --bad-soft:rgba(200,35,47,.12);
  --focus:#5B18EA; --shadow:rgba(14,15,18,.18);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#16181B; --panel:#212429; --ink:#EEEFF1; --muted:#9BA2AA; --line:#33383F; --well:#2A2E34;
    --bar:#0B0C0E; --bar-ink:#FFFFFF; --bar-muted:#8D949C; --bar-line:#2A2F35;
    --rope-r:#8F5CFF; --rope-w:#E6E7EA; --rope-b:#5A616A;
    --plate-a:#DDE0E4; --plate-b:#A6ABB2; --plate-c:#646B74; --plate-edge:#30363D; --plate-ink:#0E0F12;
    --plate-shine:rgba(255,255,255,.45);
    --accent:#8F5CFF; --on-accent:#0E0F12; --accent-soft:rgba(143,92,255,.16); --bad:#FF7A84; --bad-soft:rgba(229,85,94,.18);
    --focus:#A57DFF; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#16181B; --panel:#212429; --ink:#EEEFF1; --muted:#9BA2AA; --line:#33383F; --well:#2A2E34;
  --bar:#0B0C0E; --bar-ink:#FFFFFF; --bar-muted:#8D949C; --bar-line:#2A2F35;
  --rope-r:#8F5CFF; --rope-w:#E6E7EA; --rope-b:#5A616A;
  --plate-a:#DDE0E4; --plate-b:#A6ABB2; --plate-c:#646B74; --plate-edge:#30363D; --plate-ink:#0E0F12;
  --plate-shine:rgba(255,255,255,.45);
  --accent:#8F5CFF; --on-accent:#0E0F12; --accent-soft:rgba(143,92,255,.16); --bad:#FF7A84; --bad-soft:rgba(229,85,94,.18);
  --focus:#A57DFF; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.wrap{max-width:34rem;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Header bar and ropes (same as Title Run) */
.bar{background:var(--bar);color:var(--bar-ink)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 14px}
.brand{display:grid;gap:8px;justify-items:start}
.home{display:inline-flex;align-items:center;gap:6px;color:var(--bar-muted);text-decoration:none;font-family:var(--f-label);font-weight:700;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
.home img{width:18px;height:18px;display:block}
.home:hover,.home:focus-visible{color:var(--bar-ink)}
.mark{font-family:var(--f-display);font-weight:900;font-size:1.75rem;line-height:.85;text-transform:uppercase;letter-spacing:.01em;margin:0}
.mark span{display:block;font-family:var(--f-label);font-weight:600;font-size:.7rem;letter-spacing:.22em;color:var(--bar-muted);margin-top:6px}
.modes{display:flex;gap:2px;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--bar-line)}
.modes button{background:none;border:0;border-radius:999px;padding:7px 13px;cursor:pointer;font-family:var(--f-label);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bar-muted)}
.modes button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
.ropes{display:grid;gap:4px;padding-block:0 8px;background:var(--bar)}
.ropes i{display:block;height:4px}
.ropes i:nth-child(1){background:var(--rope-r)}
.ropes i:nth-child(2){background:var(--rope-w)}
.ropes i:nth-child(3){background:var(--rope-b)}

main{display:grid;gap:16px;padding-block:18px 44px}
.meta{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-label);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* The draw: silver nameplate showing what you have to place next */
.plate{position:sticky;top:env(safe-area-inset-top, 0px);z-index:4;overflow:hidden;border-radius:14px;padding:20px 26px 18px;color:var(--plate-ink);
  background:
    radial-gradient(circle at 13px 13px, var(--plate-edge) 3px, transparent 3.6px),
    radial-gradient(circle at calc(100% - 13px) 13px, var(--plate-edge) 3px, transparent 3.6px),
    radial-gradient(circle at 13px calc(100% - 13px), var(--plate-edge) 3px, transparent 3.6px),
    radial-gradient(circle at calc(100% - 13px) calc(100% - 13px), var(--plate-edge) 3px, transparent 3.6px),
    linear-gradient(112deg, var(--plate-b) 0%, var(--plate-a) 26%, var(--plate-b) 50%, var(--plate-a) 72%, var(--plate-c) 100%);
  box-shadow:inset 0 0 0 2px var(--plate-edge), inset 0 0 0 5px var(--plate-a), inset 0 0 0 6px var(--plate-edge), 0 8px 22px var(--shadow)}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg, transparent 35%, var(--plate-shine) 50%, transparent 65%);transform:translateX(-120%)}
.plate.glint::after{animation:glint 1s ease-out 1}
@keyframes glint{to{transform:translateX(120%)}}
.eyebrow{font-family:var(--f-label);font-weight:700;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase}
.plate h1{font-family:var(--f-display);font-weight:900;font-size:clamp(2rem, 9vw, 3.1rem);line-height:.92;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere;margin:6px 0 8px;text-shadow:0 1px 0 var(--plate-shine)}
.plate-sub{font-family:var(--f-label);font-weight:700;font-size:.9rem;letter-spacing:.18em;text-transform:uppercase;min-height:1.2em}
.hint{font-size:.92rem;color:var(--muted);margin:0}
/* The plate sticks to the top while you scroll the card; this band keeps content from showing above it on notched phones */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--canvas)}
/* Reveal: the plate itself is the button, then the revealed match shows highlighted on the plate and flashes on the card */
.plate.tap{cursor:pointer}
.plate.tap:hover,.plate.tap:focus-visible{box-shadow:inset 0 0 0 2px var(--plate-edge), inset 0 0 0 5px var(--plate-a), inset 0 0 0 6px var(--plate-edge), 0 0 0 3px var(--accent), 0 8px 22px var(--shadow);outline:none}
.plate h1 mark{background:var(--accent);color:var(--on-accent);text-shadow:none;padding:0 .14em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.stip.flash{animation:hl 2.6s ease-out 1;border-radius:4px}
@keyframes hl{0%,45%{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 4px var(--accent)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}
.hidden-bout{border-style:dashed}
.stip.mystery{font-size:1.6rem;letter-spacing:.12em;color:var(--muted)}
.unrevealed{font-size:.88rem;color:var(--muted)}
/* Grading: star rating per match, bonus tags under it, letter grade on the plate */
.stip-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rating{font-family:var(--f-display);font-weight:800;font-size:1.3rem;line-height:1;letter-spacing:.04em;color:var(--accent);white-space:nowrap}
.rating.low{color:var(--muted)}
.tags{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-family:var(--f-label);font-weight:600;font-size:.82rem;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.tags li.bad{background:var(--bad-soft);color:var(--bad)}
.plate h1 .grade{font-size:1.25em}
.plate h1 .score{font-family:var(--f-label);font-weight:700;font-size:.38em;letter-spacing:.14em;vertical-align:middle;opacity:.75}

/* The card: one block per bout, main event first */
.board{display:grid;gap:10px}
.bout{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;display:grid;gap:10px}
.bout.main{border:2px solid var(--ink);padding:14px 16px 16px}
.bout-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pos{font-family:var(--f-label);font-weight:700;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.bout.main .pos{color:var(--accent)}
.stip{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.bout.main .stip{font-size:1.5rem}
.fmt{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lineup{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.side{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.vs,.amp{font-family:var(--f-label);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.slot{min-width:0;border-radius:8px;padding:8px 12px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.bout.main .slot{font-size:1.35rem}
.slot.filled{background:var(--well)}
.bout .slot.open{color:var(--muted);font-family:var(--f-label);font-weight:600;font-size:.86rem;letter-spacing:.12em;padding:9px 14px;border:1.5px dashed var(--line);background:transparent}
.bout button.slot.open{cursor:pointer;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.bout button.slot.open:hover{background:var(--accent);color:var(--on-accent)}
.fresh{animation:slam .45s cubic-bezier(.2,1.5,.4,1) 1}
@keyframes slam{from{transform:translateY(-8px) scale(1.15);opacity:.2}to{transform:none;opacity:1}}

/* Finished card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.card h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:1.6rem;line-height:1;text-transform:uppercase}
.share{margin:0;white-space:pre-wrap;font:500 .9rem/1.4 var(--f-body);background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-family:var(--f-label);font-weight:700;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;background:var(--accent);color:var(--on-accent)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:active{transform:translateY(1px)}
.status{font-size:.88rem;color:var(--muted);min-height:1.3em;margin:0}
#copyBox{position:absolute;left:-9999px;top:0}
footer{font-size:.8rem;color:var(--muted);padding-block:0 32px}
@media (prefers-reduced-motion: reduce){ .fresh,.plate.glint::after,.stip.flash{animation:none} }
</style>

</main>

/* Seeded draws: the same seed always deals the same card and the same wrestlers, in the same order.
   Daily seed = the local date, so everyone gets the same draws that day. */
function xmur3(str){ let h = 1779033703 ^ str.length;
  for(let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const pick = (r, list) => list[Math.floor(r() * list.length)];

/* The card's structure comes from data/match_types.json "card":
   fixed   = that exact stip + format
   gimmick = any stip but Standard that allows the given format
   wild    = pick a format first, by the slot's "weights" (mostly 1v1 and 2v2), then a stip that allows it.
             Never a plain 1v1 or 2v2, never a stip already used, never a stip + format already on the card. */
function buildCard(r){
  const card = [];
  CARD.forEach(slot => { if(slot.rule === "fixed") card.push({stip: slot.stip, fmt: slot.format}); else card.push(null); });
  CARD.forEach((slot, i) => {
    const taken = new Set(card.filter(Boolean).filter(m => m.stip !== "Standard").map(m => m.stip));
    const onCard = new Set(card.filter(Boolean).map(m => m.stip + "|" + m.fmt));
    if(slot.rule === "gimmick"){
      card[i] = {stip: pick(r, STIPS.filter(s => s.name !== "Standard" && !taken.has(s.name) && s.formats.includes(slot.format))).name, fmt: slot.format};
    } else if(slot.rule === "wild"){
      const ok = (s, f) => !taken.has(s.name) && !onCard.has(s.name + "|" + f) && !(s.name === "Standard" && (f === "singles" || f === "tag"));
      const fmts = Object.keys(FORMATS).filter(f => STIPS.some(s => s.formats.includes(f) && ok(s, f)));
      const w = f => (slot.weights || {})[f] ?? 1;
      let x = r() * fmts.reduce((a, f) => a + w(f), 0), fmt = fmts[fmts.length - 1];
      for(const f of fmts){ x -= w(f); if(x < 0){ fmt = f; break; } }
      card[i] = {stip: pick(r, STIPS.filter(s => s.formats.includes(fmt) && ok(s, fmt))).name, fmt};
    }
  });
  return card;
}
function deal(seed){
  const r = mulberry32(xmur3("bb2|" + seed)());
  const matches = buildCard(r);
  const need = matches.reduce((n, m) => n + FORMATS[m.fmt].sides.reduce((a, b) => a + b, 0), 0);
  const pool = ROSTER.slice(), wrestlers = [];
  for(let i = 0; i < need; i++){ const j = i + Math.floor(r() * (pool.length - i)); [pool[i], pool[j]] = [pool[j], pool[i]]; wrestlers.push(pool[i]); }
  return {matches, wrestlers};
}

/* ---- Grading. Every number here is a knob; change it and the whole game follows.
   Match rating = average star tier of everyone in it (roster.json tier: 5 GOAT ... 1 midcarder, -1 jobber), plus bonuses:
     rivals    two rivals on opposite sides (rivals.json, or they traded a WWE/WCW/AEW world title)   once per match
     team      a real team or stable on the same side (teams.json)                                   per side, max 2
     spec      a wrestler in their specialty match (roster.json spec), each                           max 1 per match
   A jobber in the main event caps it at JOBBER_CAP. Ratings run -1 to 5 stars in quarters (Meltzer has negative stars too).
   Show score = the match ratings weighted by card position (match_types.json grade_weight), then a letter grade. */
const GRADE = {
  RIVALS: 1, TEAM: 1, TEAM_MAX: 2, SPEC: 0.5, SPEC_MAX: 1, JOBBER_CAP: 1, MIN: -1, MAX: 5, SIX: 6.5,
  // Letter cutoffs on the 5-star show score. Calibrated Nov 4 on 20,000 simulated cards per strategy: a sensible booker
  // (stars up top, jobbers to the opener) has a median of 1.95 (B-), top 10% A- or better, top 1% A+; random booking median 1.6 (C).
  LETTERS: [[3.3, "A+"], [3.0, "A"], [2.75, "A-"], [2.5, "B+"], [2.25, "B"], [2.0, "B-"], [1.8, "C+"], [1.6, "C"], [1.4, "C-"], [1.1, "D"], [-9, "F"]]
};

const rivalSrc = (a, b) => RIVAL.get(a < b ? a + "|" + b : b + "|" + a);

D.teams.forEach(([tn, ms]) => ms.forEach(n => (TEAM_OF[n] = TEAM_OF[n] || []).push(tn)));
const quarter = x => Math.round(x * 4) / 4;
function starStr(x){
  if(x >= GRADE.SIX) return "★★★★★★";
  if(x === 0) return "DUD";
  const neg = x < 0, a = Math.abs(x), full = Math.floor(a), fr = a - full;
  const f = fr === 0.25 ? "¼" : fr === 0.5 ? "½" : fr === 0.75 ? "¾" : "";
  return (neg ? "−" : "") + (full ? "★".repeat(full) + f : f + "★");      // "★★★½", "½★", "−★"
}

  for(let i = 0; i < people.length && !riv; i++) for(let j = i + 1; j < people.length && !riv; j++)
    for(const a of people[i]) { for(const b of people[j]) { const s = rivalSrc(a, b); if(s){ riv = [a, b, s]; break; } } if(riv) break; }
  if(riv){ raw += GRADE.RIVALS; tags.push(riv[2] === 2 ? `Fought over the world title: ${riv[0]} vs ${riv[1]} +${GRADE.RIVALS}★` : `Rivals: ${riv[0]} vs ${riv[1]} +${GRADE.RIVALS}★`); }
  // real teams on the same side
  let teamB = 0;
  people.forEach(side => {
    if(side.length < 2) return;
    const seen = {};
    side.forEach(n => (TEAM_OF[n] || []).forEach(tn => { seen[tn] = (seen[tn] || 0) + 1; }));
    const tn = Object.keys(seen).find(k => seen[k] >= 2);
    if(tn && teamB < GRADE.TEAM_MAX * GRADE.TEAM){ teamB += GRADE.TEAM; tags.push(`Real team: ${tn} +${GRADE.TEAM}★`); }
  });
  raw += teamB;
  // specialty match
  let specB = 0;
  all.forEach(n => { if((SPEC[n] || []).includes(m.stip) && specB < GRADE.SPEC_MAX){ specB += GRADE.SPEC; tags.push(`Specialty: ${n}, ${m.stip} +${GRADE.SPEC === 0.5 ? "½" : GRADE.SPEC}★`); } });
  raw += specB;
  let stars = quarter(Math.max(GRADE.MIN, Math.min(GRADE.MAX, raw)));
  const jobbers = all.filter(n => TIER[n] === -1);
  if(pos === 0 && jobbers.length){ stars = Math.min(stars, GRADE.JOBBER_CAP); tags.push(`Jobber in the main event: ${jobbers.join(" & ")}. Capped at ${starStr(GRADE.JOBBER_CAP)}`); }
  if(raw >= GRADE.SIX) tags.push("Meltzer broke the scale");
  return {stars: raw >= GRADE.SIX ? GRADE.SIX : stars, counts: Math.min(stars, GRADE.MAX), tags, jobbers};
}
function gradeCard(matches, peopleOf){
  const rated = matches.map((m, pos) => rateMatch(m, pos, peopleOf(pos)));
  const wsum = CARD.reduce((s, c) => s + (c.grade_weight || 0), 0);
  const score = rated.reduce((s, r, pos) => s + r.counts * (CARD[pos].grade_weight || 0), 0) / wsum;
  const letter = GRADE.LETTERS.find(([c]) => score >= c)[1];
  return {rated, score, letter, headline: headline(rated, score)};
}
function headline(rated, score){
  const main = rated[0], best = rated.reduce((b, r, i) => r.counts > rated[b].counts ? i : b, 0);
  if(main.jobbers.length) return `${main.jobbers[0]} main-evented. Fans want refunds.`;
  if(best !== 0 && rated[best].counts >= main.counts + 1.5) return `The ${CARD[best].pos.toLowerCase()} steals the show.`;
  if(score >= 3.3) return "Instant classic. Tape-trading material.";
  if(score >= 2.5) return "Strong show. The crowd went home happy.";
  if(score >= 1.8) return "Solid enough. Nobody asked for a refund.";
  if(score >= 1.1) return "Forgettable. Phones were out by the semi-main.";
  return "Buyrate disaster. Heads will roll in the office.";
}

/* Dates and puzzle numbers (local midnight, like Title Run) */
const pad = n => String(n).padStart(2, "0");
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayNo = iso => { const [y,m,d] = iso.split("-").map(Number), [ly,lm,ld] = D.launch.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ly, lm - 1, ld)) / 864e5) + 1; };

/* Game state: the seed, how many hidden matches have been revealed (r), and which slot each drawn wrestler went into (w).
   Everything else is replayed from those. */
let S = null, fresh = null, showing = false, holdTimer = null;
const valid = g => g && g.v === SAVE_V && Array.isArray(g.w) && typeof g.r === "number";
// Matches hidden until the player reveals them, in card order (gimmick semi-main, then the wild card opener)
const REVEALS = CARD.map((c, i) => c.rule === "fixed" ? -1 : i).filter(i => i >= 0);
const REVEAL_LABEL = {gimmick: "gimmick match", wild: "wild card match"};
const REVEAL_TITLE = {gimmick: "Gimmick match", wild: "Wild card"};
const revealed = pos => CARD[pos].rule === "fixed" || REVEALS.indexOf(pos) < S.r;
const ready = () => S.r >= REVEALS.length && !showing;
function load(mode){
  if(mode === "daily"){
    const today = localISO(new Date()), saved = store.get("bb-daily");
    S = valid(saved) && saved.seed === today ? saved : {v: SAVE_V, seed: today, r: 0, w: []};
  } else {
    const saved = store.get("bb-free");
    S = valid(saved) ? saved : newFree();
  }
  S.mode = mode; S.deal = deal(S.seed); fresh = null; showing = false; clearTimeout(holdTimer);
  store.set("bb-mode", mode);
}
function newFree(){ return {v: SAVE_V, seed: "free-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), r: 0, w: []}; }
function save(){ const {deal: _, mode, ...keep} = S; store.set(mode === "daily" ? "bb-daily" : "bb-free", keep); }

const done = () => S.w.length >= S.deal.wrestlers.length;
const whoIn = key => { const i = S.w.indexOf(key); return i < 0 ? null : S.deal.wrestlers[i]; };

// The plate is the reveal button. Each click shows the next hidden match on the plate, highlighted, for a beat;
// then the plate moves on (next reveal prompt, or the first wrestler after the last reveal).
function reveal(){
  if(showing || S.r >= REVEALS.length) return;
  S.r++; fresh = "m" + REVEALS[S.r - 1]; save();
  const last = S.r === REVEALS.length;
  showing = true;
  holdTimer = setTimeout(() => { showing = false; fresh = last ? "draw" : "prompt"; render(); }, last ? 1800 : 1500);
  render();
}
function placeWrestler(key){
  if(!ready() || done() || S.w.includes(key)) return;
  S.w.push(key); fresh = key; save(); render();
}

/* Rendering */
function slotHTML(key, live){
  const who = whoIn(key);
  if(who) return `<span class="slot filled${fresh === key ? " fresh" : ""}">${esc(who)}</span>`;
  return live ? `<button type="button" class="slot open" data-slot="${key}">Book here</button>`
              : `<span class="slot open">Open</span>`;
}
function boutHTML(m, pos){
  const main = pos === 0 ? " main" : "";
  if(!revealed(pos)) return `<article class="bout${main} hidden-bout">
    <div class="bout-h"><span class="pos">${esc(CARD[pos].pos)}</span></div>
    <div class="stip mystery">???</div>
    <div class="unrevealed">${CARD[pos].rule === "wild" ? "Wild card match. Could be anything." : "1v1 gimmick match."} Revealed before the draw.</div></article>`;
  const live = ready() && !done(), fl = fmtLabel(m);
  const sides = FORMATS[m.fmt].sides.map((n, side) =>
    `<div class="side">${Array.from({length: n}, (_, k) => slotHTML(`${pos}-${side}-${k}`, live)).join('<span class="amp">&amp;</span>')}</div>`);
  const now = fresh === "m" + pos, r = GRADED && GRADED.rated[pos];
  return `<article class="bout${main}${now ? " fresh" : ""}">
    <div class="bout-h"><span class="pos">${esc(CARD[pos].pos)}</span>${fl ? `<span class="fmt">${esc(fl)}</span>` : ""}</div>
    <div class="stip-row"><div class="stip${now ? " flash" : ""}">${esc(matchName(m))}</div>${r ? `<div class="rating${r.stars < 1 ? " low" : r.stars >= 4 ? " high" : ""}" aria-label="${r.stars} stars">${starStr(r.stars)}</div>` : ""}</div>
    <div class="lineup">${sides.join('<span class="vs">vs</span>')}</div>
    ${r && r.tags.length ? `<ul class="tags">${r.tags.map(x => `<li${/^Jobber/.test(x) ? ' class="bad"' : ""}>${esc(x)}</li>`).join("")}</ul>` : ""}</article>`;
}
const peopleOf = pos => FORMATS[S.deal.matches[pos].fmt].sides.map((n, side) => Array.from({length: n}, (_, k) => whoIn(`${pos}-${side}-${k}`)));
function shareText(){
  const g = gradeCard(S.deal.matches, peopleOf);
  const lines = [`${S.mode === "daily" ? `Blind Booker #${dayNo(S.seed)}` : "Blind Booker free play"}: ${g.letter}`, g.headline];
  S.deal.matches.forEach((m, pos) => {
    const fl = fmtLabel(m);
    lines.push("", `${CARD[pos].pos.toUpperCase()}: ${matchName(m)}${fl && m.stip !== "Standard" ? ` (${fl})` : ""} ${starStr(g.rated[pos].stars)}`);
    lines.push(peopleOf(pos).map(side => side.join(" & ")).join(" vs "));
  });
  if(D.site) lines.push("", D.site);
  return lines.join("\n");
}
let GRADED = null;
function render(){
  const plate = $("#plate"), n = S.deal.wrestlers.length, over = done();
  GRADED = over ? gradeCard(S.deal.matches, peopleOf) : null;
  $("#modeDaily").setAttribute("aria-pressed", S.mode === "daily");
  $("#modeFree").setAttribute("aria-pressed", S.mode === "free");
  $("#metaL").textContent = S.mode === "daily" ? `Daily #${dayNo(S.seed)}` : "Free play";
  $("#metaR").textContent = S.mode === "daily" ? new Date().toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric"}) : "";
  const prompt = S.r < REVEALS.length && !showing;          // the plate is a button right now
  plate.classList.toggle("tap", prompt);
  if(prompt){ plate.setAttribute("role", "button"); plate.tabIndex = 0; } else { plate.removeAttribute("role"); plate.removeAttribute("tabindex"); }
  if(prompt){
    const slot = CARD[REVEALS[S.r]];
    $("#drawEyebrow").textContent = slot.pos;
    $("#drawName").textContent = `Click to reveal ${REVEAL_LABEL[slot.rule]}`;
    $("#drawSub").textContent = "\u00a0";
    $("#hint").textContent = "";
  } else if(showing){
    const pos = REVEALS[S.r - 1], m = S.deal.matches[pos];
    $("#drawEyebrow").textContent = `${CARD[pos].pos}: ${REVEAL_TITLE[CARD[pos].rule]}`;
    $("#drawName").innerHTML = `<mark>${esc(matchName(m))}</mark>`;
    $("#drawSub").textContent = fmtLabel(m) || "\u00a0";
    $("#hint").textContent = "";
  } else if(!over){
    $("#drawEyebrow").textContent = `Wrestler ${S.w.length + 1} of ${n}`;
    $("#drawName").textContent = S.deal.wrestlers[S.w.length];
    $("#drawSub").textContent = " ";
    $("#hint").textContent = "Put them in any open spot. No take-backs.";
  } else {
    $("#drawEyebrow").textContent = S.mode === "daily" ? `Blind Booker #${dayNo(S.seed)}: show grade` : "Free play: show grade";
    $("#drawName").innerHTML = `<span class="grade">${esc(GRADED.letter)}</span> <span class="score">${GRADED.score.toFixed(2)} of 5</span>`;
    $("#drawSub").textContent = GRADED.headline;
    $("#hint").textContent = "Main event counts most (40%), then semi-main 25%, midcard 20%, opener 15%.";
  }
  if(fresh){ plate.classList.remove("glint"); void plate.offsetWidth; plate.classList.add("glint"); }
  $("#board").innerHTML = S.deal.matches.map(boutHTML).join("");
  $("#done").hidden = !over;
  if(over){
    $("#share").textContent = shareText();
    $("#doneTitle").textContent = S.mode === "daily" ? "Tonight's card" : "Your card";
    $("#againBtn").textContent = S.mode === "daily" ? "Free play" : "Book another";
  }
  $("#status").textContent = over && S.mode === "daily" ? nextLine() : "";
  $("#foot").textContent = `${ROSTER.length} wrestlers and ${STIPS.length - 1} gimmick matches in the pool. Daily card changes at midnight your time.`;
}
function nextLine(){
  const now = new Date(), t = new Date(now); t.setHours(24, 0, 0, 0);
  const mins = Math.max(1, Math.round((t - now) / 6e4));
  return `New card in ${Math.floor(mins / 60)}h ${mins % 60}m.`;
}

/* Wiring */
$("#board").addEventListener("click", e => {
  const b = e.target.closest("button[data-slot]"); if(b) placeWrestler(b.dataset.slot);
});
$("#plate").addEventListener("click", () => { if($("#plate").classList.contains("tap")) reveal(); });
$("#plate").addEventListener("keydown", e => {
  if($("#plate").classList.contains("tap") && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); reveal(); } });
$("#modeDaily").addEventListener("click", () => { load("daily"); render(); });
$("#modeFree").addEventListener("click", () => { load("free"); render(); });
$("#againBtn").addEventListener("click", () => {
  if(S.mode === "free") store.set("bb-free", newFree());
  load("free"); render(); window.scrollTo({top: 0, behavior: "smooth"});
});
$("#copyBtn").addEventListener("click", () => {
  const text = shareText(), ok = () => { $("#status").textContent = "Copied. Go start an argument."; };
  const fallback = () => { const box = $("#copyBox"); box.value = text; box.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ $("#status").textContent = "Couldn't copy. Select the card text and copy it yourself."; } };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
});
setInterval(() => { if(S && S.mode === "daily" && done()) $("#status").textContent = nextLine(); }, 60000);

load(store.get("bb-mode") === "free" ? "free" : "daily");
render();

</script>
</body>
</html>
